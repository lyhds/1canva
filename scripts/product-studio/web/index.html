<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CANVASRA · Product Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><a class="brand" href="/">CANVASRA<span>PRODUCT STUDIO</span></a><div class="workspace"><span class="dot"></span> 品牌工作空间 <small>LOCAL</small></div><nav><button class="nav active" data-page="jobs"><b>◫</b> 产品工作台</button><button class="nav" data-page="library"><b>▧</b> 场景参考库</button><button class="nav" data-page="settings"><b>⚙</b> 模型与店铺</button></nav><div class="sidebar-bottom"><span class="dot"></span> 后台独立执行<p>从一张灵感图，到完整商品。</p><small>CANVASRA · ARTWORK-LED STUDIO</small></div></aside>
<main><header class="topbar"><span id="breadcrumb">工作空间 / 产品工作台</span><div><span class="local-tag">仅本机访问</span><button class="primary" id="new-button">＋ 新建产品</button></div></header><div id="notice" role="status" hidden></div><section id="content"></section></main>
<dialog id="new-dialog"><form id="new-form"><div class="dialog-head"><div><small>NEW PRODUCT</small><h2>从一张参考图开始</h2></div><button type="button" class="icon" data-close>×</button></div><label class="drop" id="drop"><input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" multiple><span id="drop-label">＋<strong>选择作品参考图（可多选批量排队）</strong><small>PNG、JPG、WebP · 每张最大20MB · 可分多次添加，每张单独设置创作方式与交付范围</small></span><img id="upload-preview" hidden alt="参考图预览"></label><label>创作说明<textarea name="brief" rows="2" placeholder="例如：保留暖灰配色，让条纹更自然。可留空，由 AI 判断。"></textarea></label><label>场景偏好<textarea name="sceneBrief" rows="2" placeholder="可留空，自动按画作搭配。也可填写喜欢的空间、材质或需要避免的元素。"></textarea></label><label>场景风格<select name="sceneStyle" id="scene-style-select"><option value="">自动按画作搭配</option></select></label><p class="muted">先制定三个搭配方向，再选参考。自动制作手机 4:5 场景及独立 PC 21:9 全屏场景，保留原作比例与可换框。</p><div class="form-grid" id="single-settings"><label>创作方式<select name="mode"><option value="create">参考创作</option><option value="extract" selected>保留原作并提取</option></select></label><label>交付范围<select name="delivery"><option value="all">标准全部组合（含卷装）</option><option value="framed-only">仅绷框与浮框（特殊工艺）</option></select></label><label>完成后<select name="target"><option value="publish">自动发布到 Shopify</option><option value="draft">保存为 Shopify 草稿</option></select></label></div><div id="batch-settings" hidden></div><p class="muted">自动选图与生成，不进行 AI 审核或自动返工。不满意可手动重做；图片比例、画框定位及上架数据由程序检查。模型调用会产生费用，结果不明时先核对。</p><button class="primary wide" type="submit">创建并开始</button></form></dialog>
<dialog id="image-dialog"><button class="icon" data-close>×</button><img alt="素材原图" id="full-image"></dialog><script type="module" src="/app.js"></script></body></html>
